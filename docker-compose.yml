version: "3.9"

services:
  rag-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: enterprise-rag-chatbot:latest
    container_name: rag-chatbot
    restart: unless-stopped

    # Load secrets from .env file (never commit this file)
    env_file:
      - .env

    ports:
      - "${HOST_PORT:-8501}:8501"

    volumes:
      # Persist ChromaDB vector store between restarts
      - chroma_data:/app/enterprise-rag-chatbot/chroma_db
      # Persist user feedback logs
      - feedback_data:/app/enterprise-rag-chatbot/feedback
      # Optional: mount your own documents folder at runtime
      # - ./my-docs:/app/enterprise-rag-chatbot/data/sample_docs:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Resource limits (adjust for your server)
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

volumes:
  chroma_data:
    driver: local
  feedback_data:
    driver: local