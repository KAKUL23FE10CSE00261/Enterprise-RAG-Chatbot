version: "3.9"

# Production compose file — adds Nginx reverse proxy in front of the app.
# Usage:
#   docker compose -f docker-compose.prod.yml up -d

services:
  rag-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: enterprise-rag-chatbot:latest
    container_name: rag-chatbot
    restart: always
    env_file:
      - .env
    # Do NOT expose port directly; Nginx handles public traffic
    expose:
      - "8501"
    volumes:
      - chroma_data:/app/enterprise-rag-chatbot/chroma_db
      - feedback_data:/app/enterprise-rag-chatbot/feedback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: rag-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount SSL certs here when ready:
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      rag-chatbot:
        condition: service_healthy
    networks:
      - internal

volumes:
  chroma_data:
    driver: local
  feedback_data:
    driver: local

networks:
  internal:
    driver: bridge